name: Earshot
options:
  bundleIdPrefix: app.earshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EarshotKit:
    path: EarshotKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Earshot:
    type: application
    platform: iOS
    sources: [Earshot]
    dependencies:
      - package: EarshotKit
        product: EarshotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earshot.Earshot
        # Hand-written so that the Local Network keys only exist in Simulator builds.
        INFOPLIST_FILE: Earshot/Info.plist
        INFOPLIST_PREPROCESS: YES
        "INFOPLIST_PREPROCESSOR_DEFINITIONS[sdk=iphonesimulator*]": EARSHOT_SIMULATOR
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  EarshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EarshotUITests]
    dependencies:
      - target: Earshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earshot.EarshotUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Earshot:
    build:
      targets:
        Earshot: all
        EarshotUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [EarshotUITests]
