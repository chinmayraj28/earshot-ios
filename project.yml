name: Earshot
options:
  bundleIdPrefix: app.earshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EarshotKit:
    path: EarshotKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Earshot:
    type: application
    platform: iOS
    sources: [Earshot]
    dependencies:
      - package: EarshotKit
        product: EarshotKit
    info:
      path: Earshot/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Earshot uses the local network to find nearby iPhones and exchange messages with them directly, without the internet.
        NSBonjourServices:
          - _earshot-msg._tcp
          - _earshot-msg._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earshot.Earshot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  EarshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EarshotUITests]
    dependencies:
      - target: Earshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earshot.EarshotUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Earshot:
    build:
      targets:
        Earshot: all
        EarshotUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [EarshotUITests]
